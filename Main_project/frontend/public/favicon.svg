<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="32" fill="url(#shine)"/>
  <!-- Cart handle -->
  <path d="M12 16h5l1.5 5" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Cart body -->
  <path d="M18.5 21h27l-3.5 13H22z" fill="white" opacity="0.95"/>
  <!-- Cart bottom bar -->
  <line x1="22" y1="34" x2="42" y2="34" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="26" cy="40" r="3.2" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="38" cy="40" r="3.2" fill="white" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="26" cy="40" r="1.2" fill="#6366f1"/>
  <circle cx="38" cy="40" r="1.2" fill="#6366f1"/>
  <!-- Grocery items -->
  <circle cx="28" cy="28" r="3" fill="#4ade80"/>
  <circle cx="35" cy="27.5" r="2.5" fill="#f87171"/>
  <circle cx="31.5" cy="25.5" r="2" fill="#fbbf24"/>
</svg>

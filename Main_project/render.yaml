services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: grocery-store-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////data/grocery.db
      - key: ALLOWED_ORIGINS
        value: https://grocery-store-app.onrender.com
    disk:
      name: grocery-db
      mountPath: /data
      sizeGB: 1

  # ── Frontend (React/Vite static site) ─────────────────────────────────────
  - type: web
    name: grocery-store-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://grocery-store-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
